name: Frontend build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker build --tag macc-frontend:ci .
      - run: docker build --target build --tag macc-frontend:lint .
      - run: docker run --rm macc-frontend:lint pnpm lint
